name: CI

on:
  pull_request:
    branches: main
  push:
    branches: main
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"

jobs:
  python_tests:
    uses: inveniosoftware/workflows/.github/workflows/tests-python.yml@master
    with:
      python-version: '["3.14"]'
